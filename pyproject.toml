[project]
name = "jt-code-api"
version = "0.1.0"
description = "Django backend for JT-Code"
requires-python = ">=3.14,<3.15"
dependencies = [
  "Django>=5.2,<5.3",
  "djangorestframework>=3.17.2,<3.18",
  "django-cors-headers>=4.7,<5",
  "drf-spectacular>=0.28,<0.29",
  "dj-database-url>=2.3,<3",
  "psycopg[binary]>=3.2,<4",
  "PyJWT[crypto]>=2.10,<3",
  "redis>=5.2,<7",
  "celery[redis]>=5.5,<6",
  "confluent-kafka>=2.8,<4",
  "sentry-sdk[django]>=2.20,<3",
  "gunicorn>=23,<24",
  "uvicorn[standard]>=0.34,<1",
  "whitenoise>=6.9,<7",
  "openai>=1.40,<2",
  "google-generativeai>=0.8,<1",
  "langgraph>=0.3,<2",
  "langchain-core>=1.0,<2",
  "pgvector>=0.3.6,<0.4",
  "stripe>=8.0,<9",
  "python-docx>=1.1,<2",
  "pypdf>=6.16.1,<7",
  "markdown>=3.6,<4",
  "weasyprint>=70,<71",
  "pydyf>=0.11,<1",
  "Pillow>=12.3,<13",
  "python-multipart>=0.0.9,<1",
  "httpx>=0.27,<1",
  "cryptography>=44,<51",
  "jsonschema>=4.23,<5",
  "tenacity>=8.2,<9",
  "structlog>=24.0,<25",
]

[tool.setuptools.packages.find]
include = ["apps*", "config*"]
exclude = ["tests*", "converted_files*", "generated_images*", "rendered_documents*"]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-django>=4.11,<5",
  "pytest-cov>=6,<7",
  "pytest-xdist>=3.6,<4",
  "ruff>=0.11,<1",
  "bandit[toml]>=1.7,<2",
  "pip-audit>=2.7,<3",
  "detect-secrets>=1.5,<2",
  "mypy>=1.15,<1.20",  # django-stubs 5.2.x supports mypy <1.20
  "django-stubs>=5.2,<6",
  "djangorestframework-stubs>=3.16,<4"
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-q --disable-warnings --strict-markers"

[tool.ruff]
target-version = "py314"
line-length = 110
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "DJ"]
ignore = ["DJ001"]

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
explicit_package_bases = true
files = ["config", "apps/core", "apps/ai_gateway/providers", "apps/ai_gateway/resilience.py", "apps/ai_gateway/registry.py", "apps/agents/context.py", "apps/agents/safety.py", "apps/agents/router.py", "apps/agents/checkpoint.py", "apps/agents/graphs.py", "apps/agents/engine.py", "apps/agents/runtime.py", "apps/tools/gateway.py", "apps/tools/registry.py", "apps/tools/egress.py", "apps/tools/crypto.py", "apps/tools/credentials.py", "apps/tools/approvals.py", "apps/tools/adapters"]
follow_imports = "silent"  # "skip" hides AUTH_USER_MODEL from django-stubs and crashes mypy
strict = true
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"
