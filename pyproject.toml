[project]
name = "jt-code-api"
version = "0.1.0"
description = "Django backend for JT-Code"
requires-python = ">=3.12,<3.14"
dependencies = [
  "Django>=5.2,<5.3",
  "djangorestframework>=3.16,<3.17",
  "django-cors-headers>=4.7,<5",
  "drf-spectacular>=0.28,<0.29",
  "dj-database-url>=2.3,<3",
  "psycopg[binary]>=3.2,<4",
  "PyJWT[crypto]>=2.10,<3",
  "redis>=5.2,<7",
  "celery[redis]>=5.5,<6",
  "confluent-kafka>=2.8,<4",
  "cloudinary>=1.42,<2",
  "sentry-sdk[django]>=2.20,<3",
  "gunicorn>=23,<24",
  "uvicorn[standard]>=0.34,<1",
  "whitenoise>=6.9,<7",
  "openai>=1.40,<2",
  "anthropic>=0.35,<1",
  "google-generativeai>=0.8,<1",
  "cohere>=5.0,<6",
  "pgvector>=0.3.6,<0.4",
  "stripe>=8.0,<9",
  "python-docx>=1.1,<2",
  "pypdf>=4.0,<5",
  "markdown>=3.6,<4",
  "weasyprint>=61,<62",
  "Pillow>=10.0,<11",
  "python-multipart>=0.0.9,<1",
  "httpx>=0.27,<1",
  "tenacity>=8.2,<9",
  "structlog>=24.0,<25",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-django>=4.11,<5",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
  "django-stubs>=5.2,<6",
  "djangorestframework-stubs>=3.16,<4"
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-q --disable-warnings --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "DJ"]
ignore = ["DJ001"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"