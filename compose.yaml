# Single-server production runtime: the app, self-hosted Supabase (PostgreSQL, Auth,
# Storage), Redis and Kafka (Redpanda) on one host's private Docker network.
#
#   make prod-env           # creates .env.production with generated secrets (mode 600)
#   $EDITOR .env.production # domains, SMTP, Stripe, Sentry, Gemini, n8n
#   make compose-up-prod    # preflight (scripts/compose_env.py check), then up --build
#
# By hand: docker compose --env-file .env.production up -d --build
# `.env` is not used: on a developer machine it belongs to the native stack. To run this
# topology on a laptop, use compose.local.yaml (make docker-up).
#
# Nothing listens on a public interface: the API, the Supabase gateway and the
# dashboards bind to 127.0.0.1. A TLS reverse proxy (Caddy/nginx) on the host serves
# the API and the Supabase gateway; reach the dashboards through an SSH tunnel.
# See docs/SELF_HOSTED_DEPLOYMENT.md.

x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "5"} # a full disk would stop Redis and Kafka

x-app-env: &app-env
  DJANGO_SETTINGS_MODULE: config.settings.production
  SINGLE_HOST_DEPLOYMENT: "true"
  HEALTHCHECK_EXTERNAL_DEPENDENCIES: "true"
  # Health checks and Prometheus call the API as api:8000 / 127.0.0.1, not the public host.
  DJANGO_INTERNAL_HOSTS: api,localhost,127.0.0.1
  # Traces go to the in-host collector, which scrubs them and forwards to Tempo.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_ENVIRONMENT: production
  # Several processes per container (uvicorn and Celery workers) share one metrics registry.
  PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
  # Self-hosted Supabase: the database by service name; Auth/Storage through the gateway.
  DATABASE_URL: postgresql://postgres:${SUPABASE_DB_PASSWORD:?use make docker-up (local) or make compose-up-prod (server)}@supabase-db:5432/postgres
  DATABASE_POOLER_MODE: direct
  DATABASE_CONN_MAX_AGE: "60"
  SUPABASE_URL: ${SUPABASE_PUBLIC_URL:?use make docker-up (local) or make compose-up-prod (server)}
  SUPABASE_INTERNAL_URL: http://supabase-gateway:8000
  SUPABASE_JWT_VERIFICATION: hs256
  SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:?use make docker-up (local) or make compose-up-prod (server)}
  SUPABASE_JWT_ISSUER: ${SUPABASE_PUBLIC_URL}/auth/v1
  SUPABASE_JWKS_URL: ${SUPABASE_PUBLIC_URL}/auth/v1/.well-known/jwks.json
  SUPABASE_JWT_AUDIENCE: authenticated
  SUPABASE_SECRET_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?use make docker-up (local) or make compose-up-prod (server)}
  # Two Redis servers: an evicting cache and a non-evicting, persistent Celery broker.
  REDIS_URL: redis://:${REDIS_CACHE_PASSWORD:?use make docker-up (local) or make compose-up-prod (server)}@redis-cache:6379/0
  CELERY_BROKER_URL: redis://:${REDIS_BROKER_PASSWORD:?use make docker-up (local) or make compose-up-prod (server)}@redis-broker:6379/0
  CELERY_RESULT_BACKEND: redis://:${REDIS_BROKER_PASSWORD}@redis-broker:6379/1
  # One broker: one copy per event. PostgreSQL's outbox remains the source of truth.
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
  KAFKA_SASL_MECHANISM: SCRAM-SHA-256
  KAFKA_SASL_USERNAME: jt-producer
  KAFKA_SASL_PASSWORD: ${KAFKA_PRODUCER_PASSWORD:?use make docker-up (local) or make compose-up-prod (server)}
  KAFKA_TOPIC_REPLICATION_FACTOR: "1"
  KAFKA_TOPIC_MIN_INSYNC_REPLICAS: "1"

x-app: &app
  build: {context: ., target: runtime}
  image: jt-code-api:production
  env_file: [.env.production] # compose.local.yaml swaps in .env.docker
  environment: *app-env
  restart: unless-stopped
  logging: *logging
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  # Self-hosted Supabase: the subset JT-Code uses (Realtime and Edge Functions are not run).
  supabase-db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PORT: "5432"
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${SUPABASE_DB_PASSWORD}
      PGPORT: "5432"
      PGDATABASE: postgres
      PGPASSWORD: ${SUPABASE_DB_PASSWORD}
      JWT_EXP: ${SUPABASE_JWT_EXPIRY:-3600}
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]
    # pgAdmin (desktop, on the host) connects here: 127.0.0.1:54322, user postgres,
    # password SUPABASE_DB_PASSWORD. On a server, reach it through scripts/prod_tunnel.sh.
    ports: ["127.0.0.1:54322:5432"]
    volumes:
      - supabase-db-data:/var/lib/postgresql/data
      - supabase-db-config:/etc/postgresql-custom
      # Run only when the volume is first initialized (service-role passwords, JWT expiry).
      - ./docker/supabase/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-jt-code-roles.sql:ro
      - ./docker/supabase/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jt-code-jwt.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 12

  supabase-auth:
    image: supabase/gotrue:v2.196.0
    restart: unless-stopped
    logging: *logging
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: ${SUPABASE_PUBLIC_URL}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgresql://supabase_auth_admin:${SUPABASE_DB_PASSWORD}@supabase-db:5432/postgres
      GOTRUE_SITE_URL: ${SUPABASE_SITE_URL:?use make docker-up (local) or make compose-up-prod (server)}
      GOTRUE_URI_ALLOW_LIST: ${SUPABASE_REDIRECT_URLS:-}
      GOTRUE_DISABLE_SIGNUP: ${SUPABASE_DISABLE_SIGNUP:-false}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${SUPABASE_JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      GOTRUE_JWT_ISSUER: ${SUPABASE_PUBLIC_URL}/auth/v1
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: ${SUPABASE_MAILER_AUTOCONFIRM:-false}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SUPABASE_SMTP_ADMIN_EMAIL:?use make docker-up (local) or make compose-up-prod (server)}
      GOTRUE_SMTP_HOST: ${SUPABASE_SMTP_HOST:?use make docker-up (local) or make compose-up-prod (server)}
      GOTRUE_SMTP_PORT: ${SUPABASE_SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SUPABASE_SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SUPABASE_SMTP_PASS:-}
      GOTRUE_SMTP_SENDER_NAME: ${SUPABASE_SMTP_SENDER_NAME:-JT-Code}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      # The recovery mail carries the 6-digit code the frontend's reset form asks for.
      GOTRUE_MAILER_TEMPLATES_RECOVERY: http://supabase-gateway:8000/templates/recovery.html
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
    depends_on:
      supabase-db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 12

  supabase-rest:
    image: postgrest/postgrest:v14.17
    restart: unless-stopped
    logging: *logging
    environment:
      PGRST_DB_URI: postgresql://authenticator:${SUPABASE_DB_PASSWORD}@supabase-db:5432/postgres
      PGRST_DB_SCHEMAS: public,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${SUPABASE_JWT_EXPIRY:-3600}
      PGRST_ADMIN_SERVER_PORT: "3001"
      PGRST_ADMIN_SERVER_HOST: localhost
    depends_on:
      supabase-db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 12

  supabase-imgproxy:
    image: darthsim/imgproxy:v3.31.4
    restart: unless-stopped
    logging: *logging
    environment:
      IMGPROXY_BIND: :5001
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_AUTO_WEBP: "true"
      IMGPROXY_MAX_SRC_RESOLUTION: "16.8"
    volumes: [supabase-storage-data:/var/lib/storage]
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 5s
      timeout: 5s
      retries: 12

  supabase-storage:
    image: supabase/storage-api:v1.74.0
    restart: unless-stopped
    logging: *logging
    environment:
      ANON_KEY: ${SUPABASE_ANON_KEY:?use make docker-up (local) or make compose-up-prod (server)}
      SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      POSTGREST_URL: http://supabase-rest:3000
      AUTH_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      DATABASE_URL: postgresql://supabase_storage_admin:${SUPABASE_DB_PASSWORD}@supabase-db:5432/postgres
      STORAGE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: ${ASSET_MAX_UPLOAD_BYTES:-26214400}
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: local
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: jt-code
      REGION: local
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://supabase-imgproxy:5001
    volumes: [supabase-storage-data:/var/lib/storage]
    depends_on:
      supabase-db: {condition: service_healthy}
      supabase-rest: {condition: service_healthy}
      supabase-imgproxy: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/status"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  supabase-gateway:
    # Browsers reach this through the host's TLS proxy at SUPABASE_PUBLIC_URL.
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *logging
    ports: ["127.0.0.1:54321:8000"]
    volumes:
      - ./docker/supabase/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/native/supabase-templates:/etc/nginx/supabase-templates:ro
    depends_on:
      supabase-auth: {condition: service_healthy}
      supabase-rest: {condition: service_healthy}
      supabase-storage: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis-cache:
    image: redis:7.4-alpine
    restart: unless-stopped
    logging: *logging
    command:
      - redis-server
      - --requirepass
      - ${REDIS_CACHE_PASSWORD}
      - --maxmemory
      - ${REDIS_CACHE_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    environment:
      REDISCLI_AUTH: ${REDIS_CACHE_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis-broker:
    image: redis:7.4-alpine
    restart: unless-stopped
    logging: *logging
    command:
      - redis-server
      - --requirepass
      - ${REDIS_BROKER_PASSWORD}
      - --maxmemory
      - ${REDIS_BROKER_MAXMEMORY:-512mb}
      - --maxmemory-policy
      - noeviction # a full broker rejects new jobs instead of silently dropping queued ones
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    environment:
      REDISCLI_AUTH: ${REDIS_BROKER_PASSWORD}
    volumes: [redis-broker-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    restart: unless-stopped
    logging: *logging
    command:
      - redpanda start --smp 1 --memory ${KAFKA_MEMORY:-1G} --reserve-memory 0M --overprovisioned --check=false
      - --kafka-addr internal://0.0.0.0:9092
      - --advertise-kafka-addr internal://kafka:9092
      - --rpc-addr 0.0.0.0:33145
      - --advertise-rpc-addr kafka:33145
    volumes:
      - kafka-data:/var/lib/redpanda/data
      - ./docker/redpanda/bootstrap.yaml:/etc/redpanda/.bootstrap.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 12

  kafka-setup:
    # Creates the SCRAM users and ACLs (idempotent), then exits.
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    entrypoint: ["sh", "/setup-users.sh"]
    restart: "no"
    logging: *logging
    environment:
      KAFKA_ADMIN_PASSWORD: ${KAFKA_ADMIN_PASSWORD:?use make docker-up (local) or make compose-up-prod (server)}
      KAFKA_PRODUCER_PASSWORD: ${KAFKA_PRODUCER_PASSWORD}
      KAFKA_CONSUMER_PASSWORD: ${KAFKA_CONSUMER_PASSWORD:?use make docker-up (local) or make compose-up-prod (server)}
      KAFKA_TOPIC_PREFIX: ${KAFKA_TOPIC_PREFIX:?use make docker-up (local) or make compose-up-prod (server)}
      KAFKA_CONSUMER_GROUP_PREFIX: ${KAFKA_CONSUMER_GROUP_PREFIX:-jt-code}
    volumes: [./docker/redpanda/setup-users.sh:/setup-users.sh:ro]
    depends_on:
      kafka: {condition: service_healthy}

  migrate:
    # Migrations, storage check, topic provisioning, then `verify_messaging --strict`:
    # a misconfigured Redis or Kafka stops the rollout here.
    <<: *app
    command: ["migrate"]
    restart: "no"
    environment:
      <<: *app-env
      KAFKA_SASL_USERNAME: jt-admin
      KAFKA_SASL_PASSWORD: ${KAFKA_ADMIN_PASSWORD}
    depends_on:
      redis-cache: {condition: service_healthy}
      redis-broker: {condition: service_healthy}
      kafka-setup: {condition: service_completed_successfully}
      supabase-db: {condition: service_healthy}
      supabase-gateway: {condition: service_healthy}

  api:
    <<: *app
    command: ["api"]
    ports: ["127.0.0.1:8000:8000"] # reverse proxy on the host terminates TLS
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready/', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 5
    depends_on: &after-migrate
      migrate: {condition: service_completed_successfully}

  worker:
    <<: *app
    command: ["worker"]
    environment:
      <<: *app-env
      CELERY_QUEUES: jobs.default,jobs.analysis,jobs.ingestion,analytics.analysis,analytics.visualization,orchestration
      CELERY_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      CELERY_METRICS_PORT: "9808"
    healthcheck: &worker-health
      # A broker round trip to this worker's own control queue: it is connected and consuming.
      test: ["CMD-SHELL", "celery -A config inspect ping --destination celery@$$HOSTNAME --timeout 10 >/dev/null"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 90s
    depends_on: *after-migrate

  worker-documents:
    <<: *app
    build: {context: ., target: office}
    image: jt-code-api-office:production
    command: ["worker"]
    environment:
      <<: *app-env
      CELERY_QUEUES: jobs.visualization
      CELERY_CONCURRENCY: "2"
      CELERY_METRICS_PORT: "9808"
      HOME: /tmp
    healthcheck: *worker-health
    depends_on: *after-migrate

  beat:
    <<: *app
    command: ["beat"]
    healthcheck:
      # Beat writes its schedule after dispatching tasks (outbox publishing runs every 2 s), at
      # most every 3 minutes; a stale file means the scheduler loop has stopped dispatching.
      test: ["CMD-SHELL", "find /tmp -maxdepth 1 -name 'celerybeat-schedule*' -mmin -10 | grep -q ."]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s
    depends_on: *after-migrate

  consumer:
    <<: *app
    command: ["consumer", "integrations.webhook.received", "--consumer-name", "integration-webhooks", "--metrics-port", "9808"]
    environment:
      <<: *app-env
      KAFKA_SASL_USERNAME: jt-consumer
      KAFKA_SASL_PASSWORD: ${KAFKA_CONSUMER_PASSWORD}
    healthcheck:
      # run_kafka_consumer touches this file every 10 s while its poll loop runs.
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/kafka-consumer.heartbeat) )) -lt 120"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on: *after-migrate

  # Monitoring and dashboards: localhost only. From your computer, scripts/prod_tunnel.sh
  # opens an SSH tunnel and the browser tabs (Grafana 3000, Prometheus 9090, Kafka 8080,
  # RedisInsight 5540) and forwards the database (54322) for pgAdmin.
  prometheus:
    image: prom/prometheus:v2.55.0
    restart: unless-stopped
    logging: *logging
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        umask 077 && printf '%s' "$$METRICS_AUTH_TOKEN" > /run/jt-code/metrics-token &&
        exec /bin/prometheus --config.file=/etc/prometheus/single-host.yml
        --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    environment:
      METRICS_AUTH_TOKEN: ${METRICS_AUTH_TOKEN:?use make docker-up (local) or make compose-up-prod (server)}
    # The image runs as nobody (65534); a default tmpfs is root-owned and the token write fails.
    tmpfs: ["/run/jt-code:uid=65534,gid=65534,mode=0700"]
    volumes:
      - prometheus-data:/prometheus
      - ./infra/prometheus/single-host.yml:/etc/prometheus/single-host.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["127.0.0.1:9090:9090"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    logging: *logging
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?use make docker-up (local) or make compose-up-prod (server)}
      GF_AUTH_ANONYMOUS_ENABLED: "false" # production: everyone signs in
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      # Started, not healthy: a monitoring fault must never stop `up` from starting the app.
      prometheus: {condition: service_started}

  otel-collector:
    # The upstream image has no shell; docker/otel adds a static busybox for the health probe.
    build: {context: docker/otel}
    image: jt-code-otel-collector:0.112.0
    restart: unless-stopped
    logging: *logging
    command: ["--config=/etc/otel/collector.yaml"]
    environment:
      TRACES_BACKEND_ENDPOINT: http://tempo:4318
    volumes: [./infra/otel/collector.yaml:/etc/otel/collector.yaml:ro]
    healthcheck:
      test: ["CMD", "/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:13133/"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      tempo: {condition: service_healthy}

  tempo:
    image: grafana/tempo:2.6.1
    restart: unless-stopped
    logging: *logging
    command: ["-config.file=/etc/tempo.yaml"]
    # Traces are kept inside the container (lost on restart); metrics and logs are the durable record.
    volumes: [./infra/otel/tempo-local.yaml:/etc/tempo.yaml:ro]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3200/ready"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  redis-exporter-cache:
    image: oliver006/redis_exporter:v1.66.0-alpine # alpine variant: has wget for the health probe
    restart: unless-stopped
    logging: *logging
    environment:
      REDIS_ADDR: redis://redis-cache:6379
      REDIS_PASSWORD: ${REDIS_CACHE_PASSWORD}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9121/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      redis-cache: {condition: service_healthy}

  redis-exporter-broker:
    image: oliver006/redis_exporter:v1.66.0-alpine # alpine variant: has wget for the health probe
    restart: unless-stopped
    logging: *logging
    environment:
      REDIS_ADDR: redis://redis-broker:6379
      REDIS_PASSWORD: ${REDIS_BROKER_PASSWORD}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9121/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      redis-broker: {condition: service_healthy}

  kafka-console:
    image: redpandadata/console:v2.7.2
    restart: unless-stopped
    logging: *logging
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_SASL_ENABLED: "true"
      KAFKA_SASL_MECHANISM: SCRAM-SHA-256
      KAFKA_SASL_USERNAME: jt-admin
      KAFKA_SASL_PASSWORD: ${KAFKA_ADMIN_PASSWORD}
      REDPANDA_ADMINAPI_ENABLED: "true"
      REDPANDA_ADMINAPI_URLS: http://kafka:9644
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/admin/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      kafka-setup: {condition: service_completed_successfully}

  redisinsight:
    # Add two databases: host redis-cache / redis-broker, port 6379, with their passwords.
    image: redis/redisinsight:2.58.0
    restart: unless-stopped
    logging: *logging
    volumes: [redisinsight-data:/data]
    ports: ["127.0.0.1:5540:5540"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5540/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  supabase-db-data: {}
  supabase-db-config: {}
  supabase-storage-data: {}
  redis-broker-data: {}
  kafka-data: {}
  redisinsight-data: {}
  prometheus-data: {}
  grafana-data: {}
