# Prometheus for docker-compose.prod.yml (single server). /metrics on the API requires
# METRICS_AUTH_TOKEN; the container writes it to an in-memory file read below.
global:
  scrape_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: jt-code-api
    authorization:
      type: Bearer
      credentials_file: /run/jt-code/metrics-token
    static_configs: [{targets: ["api:8000"]}]
  - job_name: jt-code-workers
    static_configs: [{targets: ["worker:9808", "worker-documents:9808"]}]
  - job_name: jt-code-consumer
    static_configs: [{targets: ["consumer:9808"]}]
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs: [{targets: ["kafka:9644"]}]
  - job_name: redis
    static_configs: [{targets: ["redis-exporter-cache:9121", "redis-exporter-broker:9121"]}]
  # Tracing pipeline: the OTel collector's own metrics and Tempo's ingestion metrics.
  - job_name: otel-collector
    static_configs: [{targets: ["otel-collector:8888"]}]
  - job_name: tempo
    static_configs: [{targets: ["tempo:3200"]}]
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
