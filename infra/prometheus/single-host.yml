# Prometheus for compose.yaml (single server). /metrics on the API requires
# METRICS_AUTH_TOKEN; the container writes it to an in-memory file read below.
global:
  scrape_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: jt-code-api
    authorization:
      type: Bearer
      credentials_file: /run/jt-code/metrics-token
    # Docker DNS returns every replica (API_REPLICAS, --scale worker=N), so each one is scraped.
    dns_sd_configs: [{names: [api], type: A, port: 8000, refresh_interval: 30s}]
  - job_name: jt-code-workers
    dns_sd_configs:
      - {names: [worker, worker-documents], type: A, port: 9808, refresh_interval: 30s}
  - job_name: jt-code-consumer
    static_configs: [{targets: ["consumer:9808"]}]
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs: [{targets: ["kafka:9644"]}]
  - job_name: redis
    static_configs: [{targets: ["redis-exporter-cache:9121", "redis-exporter-broker:9121"]}]
  # Tracing pipeline: the OTel collector's own metrics and Tempo's ingestion metrics.
  - job_name: otel-collector
    static_configs: [{targets: ["otel-collector:8888"]}]
  - job_name: tempo
    static_configs: [{targets: ["tempo:3200"]}]
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
