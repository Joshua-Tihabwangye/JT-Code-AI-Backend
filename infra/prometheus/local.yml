# Prometheus in the local Docker stack (development DEBUG serves /metrics without a token).
global:
  scrape_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: jt-code-api
    static_configs: [{targets: ["api:8000"]}]
  - job_name: n8n
    static_configs: [{targets: ["n8n:5678"]}]
  # Kafka consumer: lag, last poll and messages by disposition (jt_kafka_consumer_*).
  - job_name: jt-code-consumer
    static_configs: [{targets: ["consumer:9808"]}]
  # Redpanda broker metrics (throughput, partitions, under-replication, storage).
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs: [{targets: ["kafka:9644"]}]
  # Redis via redis_exporter (memory, evictions, clients, commands, keyspace).
  - job_name: redis
    static_configs: [{targets: ["redis-exporter:9121"]}]
