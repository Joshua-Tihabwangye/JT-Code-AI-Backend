# Prometheus for the native local stack (`make native-observability-up`).
# Every process runs on the host; development DEBUG serves /metrics without a token.
# rule_files resolves relative to this file. Production uses single-host.yml.
global:
  scrape_interval: 15s
rule_files: [alerts.yml]
scrape_configs:
  # API: HTTP metrics plus database state (outbox, jobs, reservations).
  - job_name: jt-code-api
    static_configs: [{targets: ["127.0.0.1:8000"]}]
  # Celery worker: task outcomes and durations (jt_celery_*). One host worker consumes every queue.
  - job_name: jt-code-workers
    static_configs: [{targets: ["127.0.0.1:9808"]}]
  # Kafka consumer: lag, last poll and messages by disposition (jt_kafka_consumer_*).
  - job_name: jt-code-consumer
    static_configs: [{targets: ["127.0.0.1:9809"]}]
  # Redis via redis_exporter (memory, evictions, clients, commands, keyspace).
  - job_name: redis
    static_configs: [{targets: ["127.0.0.1:9121"]}]
  # Tracing pipeline: the OTel collector's own metrics and Tempo's ingestion metrics.
  - job_name: otel-collector
    static_configs: [{targets: ["127.0.0.1:8888"]}]
  - job_name: tempo
    static_configs: [{targets: ["127.0.0.1:3200"]}]
  - job_name: prometheus
    static_configs: [{targets: ["127.0.0.1:9090"]}]
