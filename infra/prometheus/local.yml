# Prometheus for `docker compose --profile observability` (development DEBUG serves /metrics without a token).
global:
  scrape_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: jt-code-api
    static_configs: [{targets: ["api:8000"]}]
  - job_name: n8n
    static_configs: [{targets: ["n8n:5678"]}]
