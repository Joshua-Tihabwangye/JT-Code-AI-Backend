# Prometheus scrape configuration for JT-Code (Phase 15).
#
# The API serves /metrics behind `Authorization: Bearer <METRICS_AUTH_TOKEN>`;
# mount the token as a file (never inline it here). Celery workers expose their
# own registry on CELERY_METRICS_PORT. Replace the targets with your service
# discovery (kubernetes_sd_configs) in Phase 17.
global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    service: jt-code

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: jt-code-api
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics-token
    static_configs:
      - targets: ["api:8000"]

  - job_name: jt-code-workers
    static_configs:
      - targets: ["worker-default:9808", "worker-ai:9808", "worker-ingestion:9808", "worker-analysis:9808"]

  - job_name: n8n
    metrics_path: /metrics
    static_configs:
      - targets: ["n8n-main:5678"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
