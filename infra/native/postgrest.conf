# PostgREST (Supabase Data API) for the native local stack. Rendered by scripts/native/configure.py.
# Django-owned tables are locked away from anon/authenticated (governance.0011).
db-uri = "postgresql://authenticator:${JT_SUPABASE_DB_PASSWORD}@127.0.0.1:5432/jt_code"
db-schemas = "public"
db-anon-role = "anon"
db-extra-search-path = "public, extensions"
jwt-secret = "${JT_SUPABASE_JWT_SECRET}"
server-host = "127.0.0.1"
server-port = ${POSTGREST_PORT}
admin-server-port = ${POSTGREST_ADMIN_PORT}
