# Single-binary Tempo for the native local stack. Rendered by scripts/native/configure.py.
# The OTel collector owns :4318, so Tempo receives OTLP/HTTP on :4319.
server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3200
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9096
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 127.0.0.1:4319
storage:
  trace:
    backend: local
    local:
      path: ${DATA_DIR}/tempo/traces
    wal:
      path: ${DATA_DIR}/tempo/wal
