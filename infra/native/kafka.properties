# Single-node Apache Kafka (KRaft, broker + controller) for the native local stack.
# Rendered by scripts/native/configure.py; placeholders are filled in there.
process.roles=broker,controller
node.id=1
controller.quorum.bootstrap.servers=127.0.0.1:9093
listeners=PLAINTEXT://127.0.0.1:9092,CONTROLLER://127.0.0.1:9093
advertised.listeners=PLAINTEXT://localhost:9092,CONTROLLER://127.0.0.1:9093
controller.listener.names=CONTROLLER
inter.broker.listener.name=PLAINTEXT
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
log.dirs=${DATA_DIR}/kafka

# Like production: topics come only from `manage.py ensure_kafka_topics`, never auto-created.
auto.create.topics.enable=false
num.partitions=3
# One broker: internal topics cannot have more than one replica
# (KAFKA_TOPIC_REPLICATION_FACTOR=1 / KAFKA_TOPIC_MIN_INSYNC_REPLICAS=1 for app topics).
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1
group.initial.rebalance.delay.ms=0
log.retention.hours=168
log.segment.bytes=104857600
