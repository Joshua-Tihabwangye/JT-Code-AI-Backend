# n8n in queue mode, deployed separately from the JT-Code API (Phase 16).
#
#   main     - editor UI, public REST API (workflow sync), schedules; never runs executions
#   webhook  - receives production webhook calls (Django dispatches) and enqueues them
#   worker   - executes workflows from the Redis (Bull) queue; scale horizontally
#
# State: Supabase PostgreSQL, schema "n8n", owned by a dedicated role that has no
# access to the application schema (see supabase-n8n-role.sql). Django/PostgreSQL
# stays the source of truth; n8n only reports back through signed callbacks.
#
#   cp n8n.env.example n8n.env   # fill in secrets
#   docker compose -f infra/n8n/docker-compose.yml --env-file infra/n8n/n8n.env up -d --scale n8n-worker=3

x-n8n: &n8n
  image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-1.88.0}
  restart: unless-stopped
  env_file: n8n.env
  environment:
    EXECUTIONS_MODE: queue
    QUEUE_BULL_REDIS_HOST: n8n-redis
    QUEUE_BULL_REDIS_PORT: "6379"
    QUEUE_HEALTH_CHECK_ACTIVE: "true"
    OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
    DB_TYPE: postgresdb
    DB_POSTGRESDB_SCHEMA: n8n
    DB_POSTGRESDB_SSL_ENABLED: "true"
    N8N_METRICS: "true"
    N8N_METRICS_INCLUDE_QUEUE_METRICS: "true"
    N8N_DIAGNOSTICS_ENABLED: "false"
    N8N_PERSONALIZATION_ENABLED: "false"
    N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
    N8N_HIRING_BANNER_ENABLED: "false"
    N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    N8N_SECURE_COOKIE: "true"
    N8N_PROTOCOL: https
    # Signing secrets are read from $env in the JT-Code workflows' Code nodes.
    N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    NODE_FUNCTION_ALLOW_BUILTIN: crypto
    NODE_FUNCTION_ALLOW_EXTERNAL: ""
    EXECUTIONS_DATA_PRUNE: "true"
    EXECUTIONS_DATA_MAX_AGE: "336"
    EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
    GENERIC_TIMEZONE: UTC
  depends_on:
    n8n-redis:
      condition: service_healthy

services:
  n8n-main:
    <<: *n8n
    ports: ["127.0.0.1:5678:5678"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  n8n-webhook:
    <<: *n8n
    command: webhook
    ports: ["127.0.0.1:5679:5678"]

  n8n-worker:
    <<: *n8n
    command: worker --concurrency=${N8N_WORKER_CONCURRENCY:-10}

  n8n-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${QUEUE_BULL_REDIS_PASSWORD}"]
    environment:
      REDISCLI_AUTH: ${QUEUE_BULL_REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes: ["n8n-redis:/data"]

volumes:
  n8n-redis: {}
