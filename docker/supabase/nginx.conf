server {
    listen 8000;
    server_name _;
    client_max_body_size 32m;

    # CORS answered here, as hosted Supabase's gateway does: supabase-js sends `apikey` on every call and
    # GoTrue's own CORS list rejects it, so browsers saw "failed to fetch". Tokens travel in headers (no
    # cookies), so any origin may call. The services' own CORS headers are hidden to avoid duplicates.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Access-Control-Max-Age;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "authorization, apikey, content-type, x-client-info, x-supabase-api-version, x-upsert, x-metadata, range, prefer, accept-profile, content-profile, cache-control, x-signature, x-requested-with" always;
    add_header Access-Control-Expose-Headers "content-range, content-length, etag, x-request-id, x-supabase-api-version" always;
    add_header Access-Control-Max-Age "86400" always;
    if ($request_method = OPTIONS) {
        return 204;
    }

    location = /health {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Email templates GoTrue fetches (GOTRUE_MAILER_TEMPLATES_*): the recovery email carries the one-time
    # code the frontend's reset form verifies (same files as the native stack).
    location /templates/ {
        alias /etc/nginx/supabase-templates/;
    }

    # Present the normal hosted Supabase route shape to browsers. The backend
    # uses the same gateway through the Compose network.
    location /auth/v1/ {
        proxy_pass http://supabase-auth:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Prefix /auth/v1;
    }

    location /storage/v1/ {
        proxy_pass http://supabase-storage:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /rest/v1/ {
        proxy_pass http://supabase-rest:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        default_type application/json;
        return 404 '{"message":"Unknown local Supabase route"}';
    }
}
