server {
    listen 8000;
    server_name _;
    client_max_body_size 32m;

    location = /health {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Present the normal hosted Supabase route shape to browsers. The backend
    # uses the same gateway through the Compose network.
    location /auth/v1/ {
        proxy_pass http://supabase-auth:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Prefix /auth/v1;
    }

    location /storage/v1/ {
        proxy_pass http://supabase-storage:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /rest/v1/ {
        proxy_pass http://supabase-rest:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        default_type application/json;
        return 404 '{"message":"Unknown local Supabase route"}';
    }
}
