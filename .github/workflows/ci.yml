name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: jtcode
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d jtcode"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.ci
      DJANGO_SECRET_KEY: ci-Key9aB3dE5fG7hI1jK2LmN4oP6qR8sT0uVxYz-0123456789
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jtcode
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python manage.py makemigrations --check --dry-run --settings=config.settings.ci
      - run: python manage.py migrate --noinput --settings=config.settings.ci
      - name: PostgreSQL restore drill
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          PGPASSWORD=postgres createdb --host=localhost --username=postgres jtcode_restore
          python manage.py restore_drill_check \
            --restore-database-url postgresql://postgres:postgres@localhost:5432/jtcode_restore \
            --confirm-restore-target --settings=config.settings.ci
      - run: python manage.py check --deploy --settings=config.settings.production
        env:
          DJANGO_DEBUG: 'false'
          DJANGO_ALLOWED_HOSTS: api.example.test
          CORS_ALLOWED_ORIGINS: https://app.example.test
          CSRF_TRUSTED_ORIGINS: https://app.example.test
          DATABASE_URL: postgresql://db_user:db_password@db.example.test:5432/jtcode?sslmode=verify-full
          REDIS_URL: rediss://redis.example.test:6380/0
          CELERY_BROKER_URL: rediss://redis.example.test:6380/1
          CELERY_RESULT_BACKEND: rediss://redis.example.test:6380/2
          KAFKA_BOOTSTRAP_SERVERS: kafka.example.test:9093
          KAFKA_SECURITY_PROTOCOL: SASL_SSL
          KAFKA_SASL_MECHANISM: SCRAM-SHA-512
          KAFKA_SASL_USERNAME: ci
          KAFKA_SASL_PASSWORD: ci-kafka-password
          SUPABASE_URL: https://project.example.test
          SUPABASE_JWT_SECRET: ci-supabase-jwt-secret
          SUPABASE_JWT_AUDIENCE: authenticated
          SUPABASE_JWT_ISSUER: https://project.example.test/auth/v1
          SUPABASE_WEBHOOK_SIGNING_SECRET: ci-supabase-webhook-secret
          IMAGEKIT_PUBLIC_KEY: ci-imagekit-public-key
          IMAGEKIT_PRIVATE_KEY: ci-imagekit-private-key
          IMAGEKIT_ENDPOINT_URL: https://ik.imagekit.io/project
          N8N_BASE_URL: https://n8n.example.test
          N8N_API_KEY: ci-n8n-api-key
          N8N_WEBHOOK_SECRET: ci-n8n-webhook-secret
          N8N_SENTRY_RELAY_SECRET: ci-n8n-sentry-relay-secret
          STRIPE_SECRET_KEY: sk_live_ci9mY7Kq2Vx5Zp8Lr3
          STRIPE_WEBHOOK_SECRET: whsec_ci9mY7Kq2Vx5Zp8Lr3
          SENTRY_DSN: https://public@example.ingest.sentry.io/1
          SENTRY_ENVIRONMENT: production
      - run: pytest --cov=apps --cov=config
      - name: Secret scan
        run: detect-secrets-hook --baseline .secrets.baseline $(git ls-files)
      - name: SAST
        run: bandit -q -r apps config manage.py --exclude tests
      - name: Dependency audit
        run: pip-audit --strict
