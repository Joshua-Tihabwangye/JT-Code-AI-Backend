name: CI
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"   # weekly: re-scan images and dependencies for new CVEs
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  PYTHON_VERSION: "3.14.4"
  KUSTOMIZE_VERSION: "5.4.3"
  KUBECONFORM_VERSION: "0.6.7"

jobs:
  quality:
    name: Lint, types, contracts
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.ci
      DJANGO_SECRET_KEY: ci-Key9aB3dE5fG7hI1jK2LmN4oP6qR8sT0uVxYz-0123456789
      DATABASE_URL: ${{ secrets.SUPABASE_CI_DATABASE_URL }}
      TEST_DATABASE_URL: ${{ secrets.SUPABASE_CI_TEST_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python manage.py spectacular --validate --fail-on-warn --file /tmp/openapi.yaml
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py inventory_matrix --strict
      - name: Versioned n8n workflow definitions
        run: python manage.py n8n_workflows validate
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: /tmp/openapi.yaml

  test:
    name: Supabase test suite and DAST
    runs-on: ubuntu-latest
    needs: quality
    env:
      DJANGO_SETTINGS_MODULE: config.settings.ci
      DJANGO_SECRET_KEY: ci-Key9aB3dE5fG7hI1jK2LmN4oP6qR8sT0uVxYz-0123456789
      DATABASE_URL: ${{ secrets.SUPABASE_CI_DATABASE_URL }}
      TEST_DATABASE_URL: ${{ secrets.SUPABASE_CI_TEST_DATABASE_URL }}
      REDIS_URL: ${{ secrets.CI_REDIS_URL }}
      CELERY_BROKER_URL: ${{ secrets.CI_CELERY_BROKER_URL }}
      CELERY_RESULT_BACKEND: ${{ secrets.CI_CELERY_RESULT_BACKEND }}
      WEBHOOK_ALLOWED_HOSTS: ${{ secrets.CI_WEBHOOK_ALLOWED_HOSTS }}
      WEBHOOK_SIGNING_SECRET: ${{ secrets.CI_WEBHOOK_SIGNING_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Verify isolated Supabase CI targets
        run: |
          test -n "$DATABASE_URL"
          test -n "$TEST_DATABASE_URL"
          test "$DATABASE_URL" != "$TEST_DATABASE_URL"
      - run: python manage.py migrate --noinput --settings=config.settings.ci
      - name: Verify Supabase migrations, pgvector, and tenant backfill
        run: python manage.py verify_supabase --format=json
      - name: Seed restore-drill fixture
        run: python manage.py seed_restore_drill_fixture
      - name: Validate deploy configuration shape
        run: python manage.py check --deploy --settings=config.settings.production
        env:
          DJANGO_DEBUG: 'false'
          DJANGO_ALLOWED_HOSTS: api.example.test
          CORS_ALLOWED_ORIGINS: https://app.example.test
          CSRF_TRUSTED_ORIGINS: https://app.example.test
          DATABASE_URL: postgresql://db_user:db_password@db.example.test:5432/jtcode?sslmode=verify-full
          REDIS_URL: rediss://redis.example.test:6380/0
          CELERY_BROKER_URL: rediss://redis.example.test:6380/1
          CELERY_RESULT_BACKEND: rediss://redis.example.test:6380/2
          KAFKA_BOOTSTRAP_SERVERS: kafka.example.test:9093
          KAFKA_SECURITY_PROTOCOL: SASL_SSL
          KAFKA_SASL_MECHANISM: SCRAM-SHA-512
          KAFKA_SASL_USERNAME: ci
          KAFKA_SASL_PASSWORD: ci-kafka-password
          FRONTEND_URL: https://app.example.test
          METRICS_AUTH_TOKEN: ci-metrics-scrape-token-0123456789abcdef
          SUPABASE_URL: https://project.example.test
          SUPABASE_JWKS_URL: https://project.example.test/auth/v1/.well-known/jwks.json
          SUPABASE_SECRET_KEY: sb_secret_ci9mY7Kq2Vx5Zp8Lr3
          SUPABASE_JWT_AUDIENCE: authenticated
          SUPABASE_JWT_ISSUER: https://project.example.test/auth/v1
          SUPABASE_WEBHOOK_SIGNING_SECRET: ci-supabase-webhook-secret
          SUPABASE_STORAGE_BUCKET: jt-code-assets
          SUPABASE_STORAGE_PREFIX: jt-code/ci
          N8N_BASE_URL: https://n8n.example.test
          N8N_API_KEY: ci-n8n-api-key
          N8N_WEBHOOK_SECRET: ci-n8n-callback-secret-0123456789abcdef  # pragma: allowlist secret
          N8N_DISPATCH_SECRET: ci-n8n-dispatch-secret-0123456789abcdef  # pragma: allowlist secret
          N8N_CALLBACK_BASE_URL: https://api.example.test/api/v1
          N8N_SENTRY_RELAY_SECRET: ci-n8n-sentry-relay-secret
          STRIPE_SECRET_KEY: sk_live_ci9mY7Kq2Vx5Zp8Lr3
          STRIPE_WEBHOOK_SECRET: whsec_ci9mY7Kq2Vx5Zp8Lr3
          SENTRY_DSN: https://public@example.ingest.sentry.io/1
          WEBHOOK_ALLOWED_HOSTS: callbacks.example.test
          WEBHOOK_SIGNING_SECRET: ci-outbound-callback-signing-secret
          SENTRY_ENVIRONMENT: production
          AI_PROVIDER: disabled
          TOOL_CREDENTIALS_ENCRYPTION_KEYS: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          GEMINI_API_KEY: ci-gemini-api-key-9mY7Kq2V
      - name: Full PostgreSQL test suite
        run: pytest -n 4 --create-db --cov=apps --cov=config
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: DAST - start the API for the scan
        run: |
          uvicorn config.asgi:application --host 127.0.0.1 --port 8000 --workers 2 &
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/v1/health/live/ && break; sleep 2; done
        env:
          DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      - name: DAST - OWASP ZAP API scan
        run: |
          python manage.py spectacular --file .zap/openapi.yaml
          docker run --rm --network host -v "$PWD/.zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py -t /zap/wrk/openapi.yaml -f openapi -O http://127.0.0.1:8000 \
            -c rules.tsv -r zap-report.html -J zap-report.json -I
      - name: DAST - fail on FAIL-level alerts
        run: python manage.py security_gate --zap-report .zap/zap-report.json --zap-rules .zap/rules.tsv --skip-scanners
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: .zap/zap-report.*

  security:
    name: SAST, secrets, dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install 'bandit[toml]>=1.7,<2' 'pip-audit>=2.7,<3' 'detect-secrets>=1.5,<2'
      - name: Secret scan
        run: git ls-files -co --exclude-standard -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
      - name: SAST
        run: bandit -q -r apps config manage.py --exclude tests
      - name: Dependency audit
        run: pip-audit --strict -r requirements.txt

  image:
    name: Container images (lint, build, scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: streamlit_app/Dockerfile
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: jt-code-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build office image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: office
          load: true
          tags: jt-code-api-office:ci
          cache-from: type=gha
      - name: Build Streamlit image
        uses: docker/build-push-action@v6
        with:
          context: streamlit_app
          load: true
          tags: jt-code-streamlit:ci
      - name: Images run as non-root and boot Django
        run: |
          test "$(docker run --rm --entrypoint id jt-code-api:ci -u)" = "10001"
          test "$(docker run --rm --entrypoint id jt-code-streamlit:ci -u)" = "10001"
          docker run --rm --read-only --tmpfs /tmp -e DJANGO_SETTINGS_MODULE=config.settings.build \
            jt-code-api:ci manage check
          docker run --rm --read-only --tmpfs /tmp --entrypoint soffice jt-code-api-office:ci --version
      - name: Scan images (fixed HIGH/CRITICAL vulnerabilities fail the build)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: jt-code-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: jt-code-streamlit:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan Dockerfiles, manifests and Terraform for misconfiguration
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore

  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install 'PyYAML>=6'
      - name: Generated manifests are up to date
        run: |
          python scripts/k8s/gen_base.py
          git diff --exit-code -- infra/k8s
      - name: Install kustomize and kubeconform
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar xz -C /usr/local/bin
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz -C /usr/local/bin kubeconform
      - name: Render and validate every overlay
        run: |
          for overlay in infra/k8s/overlays/*/; do
            kustomize build "$overlay" | kubeconform -strict -summary -kubernetes-version 1.30.0 \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive infra/terraform
      - name: Validate every environment root
        run: |
          for root in infra/terraform/envs/*/; do
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
          done

  observability-config:
    name: Prometheus rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Prometheus config and alert rules
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/infra/prometheus:/cfg:ro" prom/prometheus:v2.55.0 check rules /cfg/alerts.yml

  workflows:
    name: GitHub Actions lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
